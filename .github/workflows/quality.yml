name: Trace quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      TENDER_DEMO_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: node scripts/check-pdf-trace.mjs
      - run: npm run test:secrets

  pdf:
    name: PDF rendering checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pdf

  database:
    name: Disposable database and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TRACE_CI_DISPOSABLE_LOCAL: "true"
      TENDER_DEMO_MODE: "false"
      DO_NOT_TRACK: "1"
      SUPABASE_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/ci-local-db.mjs
      - run: npm run env:local
      - run: npm run build
      - run: npm run test:db
      - run: npm run test:parity
      - run: npm run test:commitment-parity
      - run: npm run test:commitment-concurrency
      - run: npm run test:concurrency
      - run: npm run test:decisions
      - run: npx playwright install --with-deps chromium chrome
      - name: Configure disposable local E2E environment
        shell: bash
        run: |
          set -euo pipefail
          local_service_role_key="$(./node_modules/.bin/supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY="\(.*\)"$/\1/p')"
          if [[ -z "$local_service_role_key" ]]; then
            echo "Local Supabase service-role key is unavailable." >&2
            exit 1
          fi
          echo "::add-mask::$local_service_role_key"
          e2e_drain_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$e2e_drain_secret"
          {
            printf '%s=%s\n' SUPABASE_SERVICE_ROLE_KEY "$local_service_role_key"
            printf '%s=%s\n' TRACE_OUTBOX_DRAIN_SECRET "$e2e_drain_secret"
            printf '%s\n' 'TRACE_MAIL_PROVIDER=smtp' 'TRACE_MAIL_FROM=quotes@trace.test' 'TENDER_DEMO_MODE=false'
          } >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - if: always()
        run: ./node_modules/.bin/supabase stop
